name: HuuHungSAMP iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned
        run: |
          xcodebuild \
            -project HuuHungSAMP.xcodeproj \
            -scheme HuuHungSAMP \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          rm -rf Payload HuuHungSAMP.ipa
          mkdir Payload
          cp -R build/Release-iphoneos/HuuHungSAMP.app Payload/
          zip -qry HuuHungSAMP.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HuuHungSAMP-IPA
          path: HuuHungSAMP.ipa
