targets:
  HuuHungSAMP:
    type: application
    platform: iOS
    deploymentTarget: "14.0" # Hoặc phiên bản iOS tương ứng của bạn
    sources: [HuuHungSAMP]
    settings:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "YOUR_TEAM_ID" # Thay mã Team ID của Apple Developer account vào đây (hoặc để trống nếu test local và dùng Xcode tự chọn)
      CODE_SIGN_IDENTITY: "Apple Development"

